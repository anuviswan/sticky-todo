name: Restrict PR Source Branch

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened, edited]

jobs:
  verify-source-branch:
    name: Verify source branch is main
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "main" ]; then
            echo "PRs into 'release' must originate from 'main'. Source branch: ${{ github.event.pull_request.head.ref }}"
            exit 1
          fi
