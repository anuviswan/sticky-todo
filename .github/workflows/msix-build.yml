name: Build MSIX Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (Major.Minor.Build.Revision, e.g. 1.0.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: msix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msix:
    name: Build MSIX Package
    # Pinned to windows-2022 rather than windows-latest: StickyDo.Widget.Package.wapproj targets
    # UAP SDK 10.0.19041.0 (min 10.0.17763.0), and newer runner images are not guaranteed to carry
    # those older Windows SDK platform files, which fails packaging with
    # "APPX3217: SDK folder containing 'UAP.props' ... cannot be located".
    runs-on: windows-2022

    env:
      WAPPROJ_PATH: src/StickyDo.Widget/StickyDo.Widget.Package/StickyDo.Widget.Package.wapproj
      MANIFEST_PATH: src/StickyDo.Widget/StickyDo.Widget.Package/Package.appxmanifest
      BUILD_CONFIGURATION: Release
      BUILD_PLATFORM: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set package version
        # MSIX identity versions must be exactly Major.Minor.Build.Revision (4 numeric parts);
        # the manifest is edited directly since classic wapproj packaging has no MSBuild property
        # for overriding Identity/@Version at build time.
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "Version '$version' is not in the required Major.Minor.Build.Revision format (e.g. 1.0.0.0)."
            exit 1
          }

          [xml]$manifest = Get-Content "${{ env.MANIFEST_PATH }}"
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("ns", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $identity = $manifest.SelectSingleNode("//ns:Identity", $ns)
          $identity.SetAttribute("Version", $version)
          $manifest.Save("${{ env.MANIFEST_PATH }}")

          Write-Host "Set package version to $version"
          echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore and build unsigned MSIX package
        # StickyDo.Widget.Package.wapproj is a classic Windows Application Packaging Project, so it
        # needs full MSBuild (not dotnet build/restore) - see README.md "MSIX Packaging".
        # AppxPackageSigningEnabled=false skips signing entirely, so no code-signing certificate is
        # required (StickyDo.Widget.Package_TemporaryKey.pfx is gitignored and never committed).
        # Microsoft Partner Center signs the package at Store submission time.
        # Version/AssemblyVersion/FileVersion are global MSBuild properties, so they flow through
        # to the StickyDo.Widget.csproj project reference and stamp the packaged .exe too.
        run: >
          msbuild "${{ env.WAPPROJ_PATH }}" -t:Restore,Build
          -p:Configuration=${{ env.BUILD_CONFIGURATION }}
          -p:Platform=${{ env.BUILD_PLATFORM }}
          -p:AppxPackageSigningEnabled=false
          -p:Version=${{ env.PACKAGE_VERSION }}
          -p:AssemblyVersion=${{ env.PACKAGE_VERSION }}
          -p:FileVersion=${{ env.PACKAGE_VERSION }}

      - name: Upload MSIX package
        # The MSIX package is the primary Store submission artifact, so publication must fail
        # the workflow if it is missing rather than silently skipping (see #107 AC).
        uses: actions/upload-artifact@v4
        with:
          name: StickyDo.Widget.Package-${{ env.PACKAGE_VERSION }}-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_PLATFORM }}-MSIX
          path: src/StickyDo.Widget/StickyDo.Widget.Package/AppPackages/**/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSIX bundle and app installer
        # A plain (non-bundled) Build only produces a loose .msix, so .msixbundle/.appinstaller
        # files are not always generated - only published when present.
        uses: actions/upload-artifact@v4
        with:
          name: StickyDo.Widget.Package-${{ env.PACKAGE_VERSION }}-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_PLATFORM }}-Bundle
          path: |
            src/StickyDo.Widget/StickyDo.Widget.Package/AppPackages/**/*.msixbundle
            src/StickyDo.Widget/StickyDo.Widget.Package/AppPackages/**/*.appinstaller
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload symbol files
        # wapproj copies each referenced project's build output - including PDBs - into the
        # packaging layout folder at bin/<Platform>/<Configuration>/StickyDo.Widget/.
        uses: actions/upload-artifact@v4
        with:
          name: StickyDo.Widget.Package-${{ env.PACKAGE_VERSION }}-${{ env.BUILD_CONFIGURATION }}-${{ env.BUILD_PLATFORM }}-Symbols
          path: src/StickyDo.Widget/StickyDo.Widget.Package/bin/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/StickyDo.Widget/**/*.pdb
          if-no-files-found: warn
          retention-days: 14
