name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3 or 1.2.3-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semantic version (expected e.g. 1.2.3 or 1.2.3-beta.1)."
            exit 1
          fi

      - name: Checkout prerelease
        uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update prerelease with main
        # Brings in anything merged (e.g. hotfixed) directly on main since prerelease last synced,
        # so the release PR opened below ends up with CHANGELOG.md as the only diff.
        run: |
          set -euo pipefail
          git fetch origin main
          git merge origin/main --no-edit

      - name: Cut the release in CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE '^## \[Unreleased\]$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [Unreleased] section to release."
            exit 1
          fi
          release_date="$(date -u +%Y-%m-%d)"
          sed -i -E "s/^## \[Unreleased\]\$/## [$VERSION] - $release_date/" CHANGELOG.md
          echo "Cut CHANGELOG.md release heading: ## [$VERSION] - $release_date"

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::error::No changes to commit - is CHANGELOG.md already up to date?"
            exit 1
          fi
          git add CHANGELOG.md
          git commit -m "chore: release v${{ inputs.version }}"

      - name: Push prerelease branch
        run: git push origin HEAD:prerelease

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --base main --head prerelease --state open --json url --jq '.[0].url' || true)"
          if [ -n "$existing_pr" ]; then
            echo "Pushed to existing pull request: $existing_pr"
          else
            gh pr create \
              --base main \
              --head prerelease \
              --title "Release v${VERSION}" \
              --body "Cuts the \`[Unreleased]\` section of CHANGELOG.md to version ${VERSION}."
          fi
