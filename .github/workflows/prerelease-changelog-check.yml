# Validates the release PR opened by "Prepare Release" (prerelease -> main): checks that it
# touches only CHANGELOG.md, that the [Unreleased] section has been cut, and that the new
# version heading carries a release date. GitHub's `branches` filter on `pull_request` only
# matches the PR's *base* branch, not its head, so it cannot restrict this trigger to PRs
# coming from "prerelease" - every PR into main will queue this workflow. The job-level `if`
# below is what actually limits real execution to prerelease -> main PRs; every other PR shows
# up as a skipped run rather than performing any checks.
name: Prerelease Changelog Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prerelease-changelog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog-check:
    name: Changelog Check
    # Release PRs (prerelease -> main) are the only ones that cut a version in CHANGELOG.md;
    # regular feature/fix PRs targeting main don't carry these rules.
    if: github.event.pull_request.head.ref == 'prerelease'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify CHANGELOG.md is the only file changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed_files=$(git diff --name-only "origin/$BASE_REF...HEAD")

          echo "Files changed in this PR:"
          echo "$changed_files"

          other_files=$(echo "$changed_files" | grep -v '^CHANGELOG\.md$' || true)
          if [ -n "$other_files" ]; then
            echo "::error::This PR must only modify CHANGELOG.md. Unexpected changes found:"
            echo "$other_files" | while IFS= read -r f; do echo "::error:: - $f"; done
            exit 1
          fi

          if ! echo "$changed_files" | grep -qx 'CHANGELOG\.md'; then
            echo "::error::This PR does not modify CHANGELOG.md."
            exit 1
          fi

      - name: Verify the Unreleased section has been cut
        run: |
          set -euo pipefail
          if grep -qiE '^## \[unreleased\]' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still has an [Unreleased] section. Replace it with the release version and date before merging to main."
            exit 1
          fi

      - name: Verify the latest version has a release date
        run: |
          set -euo pipefail
          latest_heading=$(grep -m1 -E '^## \[' CHANGELOG.md || true)

          if [ -z "$latest_heading" ]; then
            echo "::error::No version heading (e.g. '## [1.0.0] - 2026-08-13') found in CHANGELOG.md."
            exit 1
          fi

          echo "Latest changelog heading: $latest_heading"

          # Keep a Changelog format: "## [x.y.z] - YYYY-MM-DD"
          if ! echo "$latest_heading" | grep -qE '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Latest changelog entry is missing a release date in YYYY-MM-DD format, as required by Keep a Changelog: '$latest_heading'"
            exit 1
          fi
