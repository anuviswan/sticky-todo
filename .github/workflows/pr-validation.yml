name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # StickyDo.Widget targets net10.0-windows (WPF), so the solution can only build on Windows.
    runs-on: windows-latest

    env:
      SOLUTION_PATH: src/StickyDo.Widget/StickyDo.Widget.sln
      BUILD_CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Dead code analysis (compiler diagnostics)
        # Promotes specific high-confidence dead-code compiler warnings to build errors:
        # unreachable code (CS0162), unused exception variable (CS0168), unused local variable
        # (CS0219), field assigned but never read (CS0414), unused local function (CS8321).
        # Every other compiler warning is left as a warning and does not fail this step.
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore -warnaserror:CS0162,CS0168,CS0219,CS0414,CS8321 -clp:ErrorsOnly -v minimal

      - name: Dead code analysis (unused members and usings)
        # dotnet format's analyzer pass evaluates IDE-style diagnostics (unused private members,
        # unused using directives, redundant assignments) that `dotnet build` does not reliably
        # surface on its own, even with EnforceCodeStyleInBuild set. Severities are configured in
        # .editorconfig at the repo root. --verify-no-changes exits non-zero if any diagnostic at
        # or above "warn" severity is found, without modifying any files.
        run: dotnet format analyzers "${{ env.SOLUTION_PATH }}" --verify-no-changes --severity warn

      - name: Test
        # -m:1 forces MSBuild to run each test project's Test target sequentially rather than in
        # parallel: StickyDo.Domain.Tests and StickyDo.Widget.Tests both exercise the same real
        # %LocalAppData%\StickyDo directory as test setup/teardown, and running them concurrently
        # races on that shared path.
        run: dotnet test "${{ env.SOLUTION_PATH }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-build -m:1 --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 14
